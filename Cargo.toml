[package]
name = "jobpipe"
version = "1.0.3"
edition = "2021"
description = "Daily ranked digest of new job postings pulled from company ATS boards"
license = "MIT"
readme = "README.md"

[dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sea-orm = { version = "1.1", features = ["sqlx-sqlite", "runtime-tokio-rustls", "macros"] }
sea-orm-migration = { version = "1.1", default-features = false, features = ["sqlx-sqlite", "runtime-tokio-rustls"] }
clap = { version = "4", features = ["derive", "env"] }
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = { version = "0.4", features = ["serde"] }
toml = "0.8"
html-escape = "0.2"
futures = "0.3"
async-trait = "0.1"
regex = "1"
dotenvy = "0.15"
once_cell = "1"
dialoguer = { version = "0.11", default-features = false, features = ["fuzzy-select"] }
skim = { version = "5.6.1", default-features = false }
